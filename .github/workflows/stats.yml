name: Profile Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAR_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: python3 scripts/profile_stats.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats.svg data/history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile stats"
            git push
          fi
